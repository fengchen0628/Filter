name: Auto Convert Emby Rules

on:
  push:
    paths:
      - 'rules/emby.list'   # 🎯 仅在 rules/emby.list 发生更新时触发
  workflow_dispatch:        # 支持在 GitHub 网页端手动触发

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 赋予提交权限

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Converter Script
        run: python generate_yaml.py

      - name: Commit & Push Generated Rules
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update emby_direct & emby_proxy rules [skip ci]"
          file_pattern: "generated/*"
          branch: ${{ github.ref_name }}
